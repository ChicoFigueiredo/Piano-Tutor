[workspace]
resolver = "3"
members = [
    "crates/piano-tutor-core",
    "crates/piano-tutor-diag",
    "crates/piano-tutor-app",
    "crates/piano-tutor-midi",
    "crates/piano-tutor-audio",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# TEMPORÁRIO (cerebro): bancada-casca local, branch claude/piano-tutor-controles-ribbon (commit 6d296a7),
# com controles do app no Ribbon e ícone da janela. Trocar pelo rev publicado quando o branch subir.
[patch."https://github.com/ChicoFigueiredo/bancada"]
bancada-casca = { path = "/home/chico/bancada-noite/crates/bancada-casca" }
