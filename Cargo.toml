[workspace]
resolver = "3"
members = [
    "crates/piano-tutor-core",
    "crates/piano-tutor-diag",
    "crates/piano-tutor-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
