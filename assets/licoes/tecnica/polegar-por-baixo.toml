[licao]
id = "tecnica-polegar-por-baixo"
trilha = "Técnica"
ordem_trilha = 40
ordem = 5
titulo = "Polegar por baixo"
descricao = "Passar o polegar por baixo da mão para tocar uma oitava sem mudar a posição. Prepara as escalas."
nivel = "basico"
situacao = "proposta"
fontes = ["Wikipedia: Fingering (music) (https://en.wikipedia.org/wiki/Fingering_(music))", "Dummies: Piano for Dummies, posições de Dó e Sol (https://www.dummies.com/article/academics-the-arts/music/instruments/piano/how-to-play-the-piano-or-keyboard-in-c-and-g-position-153031/)", "Prática pedagógica comum: passagem do polegar na escala de Dó maior"]
requer = ["tecnica-cinco-dedos-legato", "fundamentos-cinco-dedos-sol"]

[[exercicio]]
id = "tres-dedos-e-polegar"
titulo = "Três dedos e polegar"
tipo = "sequencia"
mao = "direita"
objetivo = "Passar o polegar depois do dedo 3."
instrucoes = "Toque Dó, Ré e Mi com os dedos 1, 2 e 3. Depois passe o polegar por baixo e toque o Fá."
dedilhado = "1-2-3-1"
passos = "C4 D4 E4 F4"
roteiro = [
  "Ponha o polegar direito no Dó central.",
  "Toque Dó, Ré e Mi com os dedos 1, 2 e 3.",
  "Leve o polegar por baixo dos dedos, com o pulso solto.",
  "Toque o Fá com o polegar, sem levantar o cotovelo.",
]
acerto = "Nota certa."
erro = "Depois do Mi, o polegar vai para o Fá."

