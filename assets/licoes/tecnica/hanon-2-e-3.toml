[licao]
id = "tecnica-hanon-2-e-3"
trilha = "Técnica"
ordem_trilha = 40
ordem = 4
titulo = "Hanon 2 e 3, versão curta"
descricao = "Os exercícios 2 e 3 de Hanon reduzidos a um e dois grupos, com o dedo 5 mais ativo."
nivel = "basico"
situacao = "proposta"
fontes = ["Hanon, C.-L., Le Pianiste virtuose en 60 exercices (Boulogne, 1873), exercícios 1 a 3, domínio público (IMSLP: https://imslp.org/wiki/The_Virtuoso_Pianist_(Hanon,_Charles-Louis))", "Mutopia Project: The Virtuoso Pianist, Part I (https://www.mutopiaproject.org/cgibin/piece-info.cgi?id=2037), usada só para conferir notas e dedos", "Wikipedia: The Virtuoso Pianist in 60 Exercises (https://en.wikipedia.org/wiki/The_Virtuoso_Pianist_in_60_Exercises)"]
requer = ["tecnica-hanon-1"]

[[exercicio]]
id = "hanon-2-direita"
titulo = "Hanon 2, direita"
tipo = "sequencia"
mao = "direita"
objetivo = "Tocar o grupo do Hanon 2 com a direita."
instrucoes = "Toque Dó, Mi, Lá, Sol, Fá, Sol, Fá e Mi. Os dedos são 1, 2, 5, 4, 3, 4, 3 e 2."
dedilhado = "1-2-5-4-3-4-3-2"
passos = "C4 E4 A4 G4 F4 G4 F4 E4"
roteiro = [
  "Ponha o polegar direito no Dó central.",
  "Toque o Dó (1) e o Mi (2), e abra a mão até o Lá (5).",
  "Volte tocando Sol (4), Fá (3), Sol (4) e Fá (3).",
  "Termine com o dedo 2 no Mi.",
]
acerto = "Nota certa."
erro = "O quinto dedo toca o Lá, depois Sol, Fá, Sol, Fá e Mi."

