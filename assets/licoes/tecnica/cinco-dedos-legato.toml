[licao]
id = "tecnica-cinco-dedos-legato"
trilha = "Técnica"
ordem_trilha = 40
ordem = 2
titulo = "Cinco dedos em legato"
descricao = "Ligar as notas da posição de cinco dedos, sem buracos entre elas."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Wikipedia: Fingering (music) (https://en.wikipedia.org/wiki/Fingering_(music))", "Dummies: Piano for Dummies, posições de Dó e Sol (https://www.dummies.com/article/academics-the-arts/music/instruments/piano/how-to-play-the-piano-or-keyboard-in-c-and-g-position-153031/)", "Prática pedagógica comum: toque legato em cinco dedos"]
requer = ["fundamentos-cinco-dedos-do"]

[[exercicio]]
id = "legato-subindo"
titulo = "Legato subindo"
tipo = "sequencia"
mao = "direita"
objetivo = "Ligar cinco notas subindo."
instrucoes = "Toque Dó, Ré, Mi, Fá e Sol ligados. A tecla anterior só sobe quando a próxima desce."
dedilhado = "1-2-3-4-5"
passos = "C4 D4 E4 F4 G4"
roteiro = [
  "Ponha o polegar direito no Dó central.",
  "Toque o Dó e mantenha a tecla até tocar o Ré.",
  "Solte cada tecla só quando a seguinte soar.",
  "O som deve ficar contínuo, sem buracos.",
]
acerto = "Nota ligada."
erro = "Sem pausa entre as notas."

[[exercicio]]
id = "legato-descendo"
titulo = "Legato descendo"
tipo = "sequencia"
mao = "direita"
objetivo = "Ligar cinco notas descendo."
instrucoes = "Toque Sol, Fá, Mi, Ré e Dó ligados, sem buracos entre as notas."
dedilhado = "5-4-3-2-1"
passos = "G4 F4 E4 D4 C4"
roteiro = [
  "Comece com o dedo 5 sobre o Sol.",
  "Toque cada nota descendo, solta e sem pausa.",
  "Solte a tecla só quando a seguinte soar.",
  "Termine no Dó com o polegar.",
]
acerto = "Nota ligada."

[[exercicio]]
