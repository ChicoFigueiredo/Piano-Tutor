passos = "C4 D4 E4 F4 G4 F4 E4 D4 C4"
roteiro = [
  "Posicione o polegar direito no Dó.",
  "Suba até o Sol ligando as notas.",
  "No Sol, comece a descer sem parar.",
  "Termine no Dó com o polegar e solte a tecla com calma.",
]
acerto = "Nota ligada."

