situacao = "proposta"
fontes = ["Dummies: Piano for Dummies, posições de Dó e Sol (https://www.dummies.com/article/academics-the-arts/music/instruments/piano/how-to-play-the-piano-or-keyboard-in-c-and-g-position-153031/)", "Wikipedia: Fingering (music) (https://en.wikipedia.org/wiki/Fingering_(music))"]
