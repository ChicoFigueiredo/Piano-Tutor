[[exercicio]]
id = "direita-subindo"
titulo = "Direita subindo"
tipo = "sequencia"
mao = "direita"
objetivo = "Tocar de Fá a Dó com a mão direita."
instrucoes = "Ponha o polegar no Fá. O quarto dedo toca uma tecla preta: o Si bemol. Toque Fá, Sol, Lá, Si bemol e Dó."
dedilhado = "1-2-3-4-5"
passos = "F4 G4 A4 Bb4 C5"
roteiro = [
  "Ponha o polegar direito no Fá, logo à esquerda do grupo de três pretas.",
  "O dedo 4 fica sobre a preta Si bemol, a terceira preta do grupo de três.",
  "Toque Fá, Sol e Lá com os dedos 1, 2 e 3.",
  "Toque a preta com o dedo 4 e termine no Dó com o dedo 5.",
]
acerto = "Degrau certo."
erro = "A quarta nota é preta: Si bemol."

[[exercicio]]
id = "direita-descendo"
titulo = "Direita descendo"
tipo = "sequencia"
mao = "direita"
objetivo = "Descer de Dó a Fá com a mão direita."
instrucoes = "Comece no Dó, com o dedo 5. Passe pelo Si bemol e chegue ao Fá."
dedilhado = "5-4-3-2-1"
passos = "C5 Bb4 A4 G4 F4"
roteiro = [
  "Comece no Dó, com o dedo 5.",
  "Desça para o Si bemol com o dedo 4: é a preta ao lado do Lá.",
  "Siga por Lá, Sol e Fá.",
  "Termine com o polegar no Fá.",
]
acerto = "Degrau certo."

