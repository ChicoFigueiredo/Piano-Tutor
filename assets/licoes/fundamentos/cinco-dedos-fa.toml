tipo = "sequencia"
mao = "direita"
objetivo = "Ligar as três posições aprendidas."
instrucoes = "Toque Dó, Mi e Sol. Depois Sol, Si e Ré. Depois Fá, Lá e Dó. Mude a mão a cada trio."
dedilhado = "1-3-5-1-3-5-1-3-5"
passos = "C4 E4 G4 G4 B4 D5 F4 A4 C5"
roteiro = [
  "Comece na posição de Dó: toque Dó, Mi e Sol.",
  "Mude a mão para a posição de Sol e toque Sol, Si e Ré.",
  "Mude de novo para a posição de Fá e toque Fá, Lá e Dó.",
  "Em cada mudança, o polegar vai para a primeira nota do trio.",
]
acerto = "Trio certo."
erro = "Cada trio começa com o polegar."
conclusao = "Você conhece as três posições de cinco dedos."
