roteiro = [
  "Ponha a mão direita na posição de Dó.",
  "Toque o Dó com o polegar e o Mi com o dedo 3.",
  "Pule a tecla do Ré e do Fá: só o Sol, com o dedo 5.",
  "Volte tocando Mi e Dó, sem pressa.",
]
acerto = "Salto certo."
erro = "Pule uma tecla branca entre uma nota e outra."

