passos = "C4 D4 E4 F4 G4 F4 E4 D4 C4"
roteiro = [
  "Posicione a mão direita com o polegar no Dó.",
  "Suba do dedo 1 ao 5, uma nota por dedo.",
  "Toque o Sol uma vez só e comece a descer.",
  "Chegue ao Dó e pare, sem apertar demais.",
]
acerto = "Degrau certo."

