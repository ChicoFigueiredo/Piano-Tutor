[licao]
id = "fundamentos-cinco-dedos-do"
trilha = "Fundamentos"
ordem_trilha = 10
ordem = 3
titulo = "Cinco dedos em Dó"
descricao = "Posição de cinco dedos em Dó, na mão direita e na esquerda, com passo e salto de dedo."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Dummies: Piano for Dummies, posições de Dó e Sol (https://www.dummies.com/article/academics-the-arts/music/instruments/piano/how-to-play-the-piano-or-keyboard-in-c-and-g-position-153031/)", "Wikipedia: Fingering (music) (https://en.wikipedia.org/wiki/Fingering_(music))", "Skoove: Ode to Joy piano tutorial, mão direita na posição de Dó (https://www.skoove.com/blog/ode-to-joy-piano-tutorial)"]
requer = ["fundamentos-geografia-do-teclado"]

[[exercicio]]
id = "direita-subindo"
titulo = "Direita subindo"
tipo = "sequencia"
mao = "direita"
objetivo = "Tocar cinco notas subindo com a mão direita."
instrucoes = "Ponha o polegar no Dó central. Cada dedo fica sobre uma tecla. Toque Dó, Ré, Mi, Fá e Sol."
dedilhado = "1-2-3-4-5"
passos = "C4 D4 E4 F4 G4"
roteiro = [
  "Ponha o polegar direito no Dó central, com o pulso solto.",
  "Deixe os outros dedos curvos sobre Ré, Mi, Fá e Sol.",
  "Toque uma nota por dedo, de 1 a 5.",
  "Ouça o som subindo.",
]
acerto = "Degrau certo."
erro = "Um dedo por tecla, em ordem."

[[exercicio]]
id = "direita-descendo"
titulo = "Direita descendo"
tipo = "sequencia"
mao = "direita"
objetivo = "Tocar cinco notas descendo com a mão direita."
instrucoes = "Comece no Sol, com o dedo 5. Desça até o Dó, com o polegar."
dedilhado = "5-4-3-2-1"
passos = "G4 F4 E4 D4 C4"
roteiro = [
  "Comece com o dedo 5 sobre o Sol.",
  "Toque cada tecla ao descer, do dedo 5 ao dedo 1.",
  "Termine com o polegar no Dó central.",
  "Mantenha a mão no mesmo lugar, sem pular.",
]
acerto = "Degrau certo."
erro = "Desça uma tecla branca por vez."

