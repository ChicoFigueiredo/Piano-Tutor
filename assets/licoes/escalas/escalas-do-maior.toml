[licao]
id = "escalas-do-maior"
trilha = "Escalas"
ordem_trilha = 20
ordem = 1
titulo = "Escala de Dó maior"
descricao = "Dó maior, uma oitava, subindo e descendo, mão direita e mão esquerda."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Fingering charts, piano scales (Univ. de Miami): https://www.cs.miami.edu/~burt/music/finger-charts.html", "Piano Major Scales (pianoscales.org): https://pianoscales.org/major.html", "Wikiversity, Piano: how to read piano music and play scales using proper technique: https://en.wikiversity.org/wiki/Piano/How_to_read_piano_music_and_play_scales_using_proper_technique"]
requer = []

[[exercicio]]
id = "c-maior-md-sub"
titulo = "Dó maior: subindo, mão direita"
tipo = "escala"
mao = "direita"
objetivo = "Tocar a escala de Dó maior subindo, uma oitava, com a mão direita."
instrucoes = "Use a mão direita. Toque Dó, Ré, Mi, Fá, Sol, Lá, Si e Dó, de baixo para cima. Todas as teclas são brancas. Comece com o dedo 1."
dedilhado = "1-2-3-1-2-3-4-5"
passos = "C4 D4 E4 F4 G4 A4 B4 C5"
roteiro = [
  "Sente-se de frente para o teclado, com a mão direita solta e os dedos curvos, perto do Dó central.",
  "Ponha o dedo 1 no Dó. Confira as teclas pretas da escala. Todas as teclas são brancas.",
  "Depois do Mi, passe o polegar por baixo e toque o Fá com o dedo 1.",
  "Termine no Dó com o dedo 5, tocando parelho e sem pressa.",
]
erro = "Confira as teclas: Todas as teclas são brancas."
conclusao = "Dó maior, subindo, mão direita, concluída."

