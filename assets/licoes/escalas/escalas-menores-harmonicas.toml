  "Sente-se de frente para o teclado, com a mão direita solta e os dedos curvos, perto do Dó central.",
  "Ponha o dedo 1 no Mi. Confira as teclas pretas da escala. Fá# e Ré#: o Ré# é a sétima nota elevada.",
  "Depois do Sol, passe o polegar por baixo e toque o Lá com o dedo 1.",
  "Chegue ao Mi sem parar e volte pelo mesmo caminho, com os dedos ao contrário.",
]
erro = "Confira as teclas: Fá# e Ré#: o Ré# é a sétima nota elevada."
conclusao = "Mi menor harmônica, subindo e descendo, mão direita, concluída."

