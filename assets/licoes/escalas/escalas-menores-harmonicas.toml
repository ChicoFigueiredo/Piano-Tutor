[[exercicio]]
id = "a-har-md-subdesc"
titulo = "Lá menor harmônica: subindo e descendo, mão direita"
tipo = "escala"
mao = "direita"
objetivo = "Tocar a escala de Lá menor harmônica subindo e descendo, uma oitava, com a mão direita."
instrucoes = "Use a mão direita. Suba e volte sem parar na nota mais aguda: Lá, Si, Dó, Ré, Mi, Fá, Sol#, Lá, Sol#, Fá, Mi, Ré, Dó, Si e Lá. O Sol é sustenido (Sol#): a sétima nota sobe meio tom. Comece com o dedo 1."
dedilhado = "1-2-3-1-2-3-4-5-4-3-2-1-3-2-1"
passos = "A4 B4 C5 D5 E5 F5 G#5 A5 G#5 F5 E5 D5 C5 B4 A4"
roteiro = [
  "Sente-se de frente para o teclado, com a mão direita solta e os dedos curvos, perto do Dó central.",
  "Ponha o dedo 1 no Lá. Confira as teclas pretas da escala. O Sol é sustenido (Sol#): a sétima nota sobe meio tom.",
  "Depois do Dó, passe o polegar por baixo e toque o Ré com o dedo 1.",
  "Chegue ao Lá sem parar e volte pelo mesmo caminho, com os dedos ao contrário.",
]
erro = "Confira as teclas: O Sol é sustenido (Sol#): a sétima nota sobe meio tom."
conclusao = "Lá menor harmônica, subindo e descendo, mão direita, concluída."

