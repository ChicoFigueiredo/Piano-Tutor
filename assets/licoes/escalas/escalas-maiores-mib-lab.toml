[[exercicio]]
id = "eb-maior-md-sub"
titulo = "Mib maior: subindo, mão direita"
tipo = "escala"
mao = "direita"
objetivo = "Tocar a escala de Mib maior subindo, uma oitava, com a mão direita."
instrucoes = "Use a mão direita. Toque Mib, Fá, Sol, Láb, Sib, Dó, Ré e Mib, de baixo para cima. Três bemóis: Sib, Mib e Láb. Comece com o dedo 3. Comece com o dedo 3 no Mib; o polegar toca o Fá."
dedilhado = "3-1-2-3-4-1-2-3"
passos = "Eb4 F4 G4 Ab4 Bb4 C5 D5 Eb5"
roteiro = [
  "Sente-se de frente para o teclado, com a mão direita solta e os dedos curvos, perto do Dó central.",
  "Ponha o dedo 3 no Mib. Confira as teclas pretas da escala. Três bemóis: Sib, Mib e Láb.",
  "Depois do Mib, passe o polegar por baixo e toque o Fá com o dedo 1.",
  "Depois do Sib, passe o polegar por baixo e toque o Dó com o dedo 1.",
  "Termine no Mib com o dedo 3, tocando parelho e sem pressa.",
]
erro = "Confira as teclas: Três bemóis: Sib, Mib e Láb."
conclusao = "Mib maior, subindo, mão direita, concluída."

