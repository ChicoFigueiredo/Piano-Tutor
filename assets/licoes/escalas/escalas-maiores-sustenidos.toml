[licao]
id = "escalas-maiores-sustenidos"
trilha = "Escalas"
ordem_trilha = 20
ordem = 2
titulo = "Escalas maiores com sustenidos"
descricao = "Sol, Ré, Lá e Mi maior pelo ciclo das quintas, uma oitava, mão direita e mão esquerda."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Fingering charts, piano scales (Univ. de Miami): https://www.cs.miami.edu/~burt/music/finger-charts.html", "Piano Major Scales (pianoscales.org): https://pianoscales.org/major.html", "Wikiversity, Piano: how to read piano music and play scales using proper technique: https://en.wikiversity.org/wiki/Piano/How_to_read_piano_music_and_play_scales_using_proper_technique", "Circle of fifths (Wikipedia): https://en.wikipedia.org/wiki/Circle_of_fifths"]
requer = []

[[exercicio]]
id = "g-maior-md-subdesc"
titulo = "Sol maior: subindo e descendo, mão direita"
tipo = "escala"
mao = "direita"
objetivo = "Tocar a escala de Sol maior subindo e descendo, uma oitava, com a mão direita."
instrucoes = "Use a mão direita. Suba e volte sem parar na nota mais aguda: Sol, Lá, Si, Dó, Ré, Mi, Fá#, Sol, Fá#, Mi, Ré, Dó, Si, Lá e Sol. O Fá é sustenido: use a tecla preta (Fá#). Comece com o dedo 1."
dedilhado = "1-2-3-1-2-3-4-5-4-3-2-1-3-2-1"
passos = "G4 A4 B4 C5 D5 E5 F#5 G5 F#5 E5 D5 C5 B4 A4 G4"
roteiro = [
  "Sente-se de frente para o teclado, com a mão direita solta e os dedos curvos, perto do Dó central.",
  "Ponha o dedo 1 no Sol. Confira as teclas pretas da escala. O Fá é sustenido: use a tecla preta (Fá#).",
  "Depois do Si, passe o polegar por baixo e toque o Dó com o dedo 1.",
  "Chegue ao Sol sem parar e volte pelo mesmo caminho, com os dedos ao contrário.",
]
erro = "Confira as teclas: O Fá é sustenido: use a tecla preta (Fá#)."
conclusao = "Sol maior, subindo e descendo, mão direita, concluída."

