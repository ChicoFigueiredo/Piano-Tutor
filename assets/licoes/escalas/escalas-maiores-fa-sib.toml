[[exercicio]]
id = "f-maior-md-sub"
titulo = "Fá maior: subindo, mão direita"
tipo = "escala"
mao = "direita"
objetivo = "Tocar a escala de Fá maior subindo, uma oitava, com a mão direita."
instrucoes = "Use a mão direita. Toque Fá, Sol, Lá, Sib, Dó, Ré, Mi e Fá, de baixo para cima. O Si é bemol: use a tecla preta (Sib). Comece com o dedo 1. Depois do Lá, o dedo 4 toca o Sib e o polegar passa por baixo para o Dó."
dedilhado = "1-2-3-4-1-2-3-4"
passos = "F4 G4 A4 Bb4 C5 D5 E5 F5"
roteiro = [
  "Sente-se de frente para o teclado, com a mão direita solta e os dedos curvos, perto do Dó central.",
  "Ponha o dedo 1 no Fá. Confira as teclas pretas da escala. O Si é bemol: use a tecla preta (Sib).",
  "Depois do Sib, passe o polegar por baixo e toque o Dó com o dedo 1.",
  "Termine no Fá com o dedo 4, tocando parelho e sem pressa.",
]
erro = "Confira as teclas: O Si é bemol: use a tecla preta (Sib)."
conclusao = "Fá maior, subindo, mão direita, concluída."

