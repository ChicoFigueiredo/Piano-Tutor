[[exercicio]]
id = "do-md-1oit-sub"
titulo = "Dó maior: arpejo de uma oitava, subindo, mão direita"
tipo = "arpejo"
mao = "direita"
objetivo = "Tocar as notas de Dó maior uma a uma, subindo."
instrucoes = "Toque Dó, Mi, Sol e Dó, uma nota de cada vez. Sem dedilhado fixo: use o que ficar confortável."
passos = "C4 E4 G4 C5"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Comece no Dó, a fundamental do acorde.",
  "Escolha os dedos que deixem a mão confortável, sem esticar demais.",
  "Toque uma nota de cada vez, soltando a anterior, com som parelho.",
  "A ordem é Dó, Mi, Sol e Dó.",
]
erro = "Toque só as notas do acorde, uma de cada vez, sem pular nem repetir."

