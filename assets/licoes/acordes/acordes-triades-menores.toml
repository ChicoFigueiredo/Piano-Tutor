[licao]
id = "acordes-triades-menores"
trilha = "Acordes"
ordem_trilha = 30
ordem = 2
titulo = "Tríades menores nos 12 tons"
descricao = "Tríades menores em todos os 12 tons: a terça é meio tom mais baixa."
nivel = "basico"
situacao = "proposta"
fontes = ["Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde", "Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Introduction to Chords, musictheory.net: https://musictheory.net/lessons/40"]
requer = []

[[exercicio]]
id = "do-maior-para-menor"
titulo = "De Dó maior para Dó menor"
tipo = "acorde"
mao = "direita"
objetivo = "Perceber que abaixar a terça meio tom transforma o acorde maior em menor."
instrucoes = "A tríade menor tem a terça menor (3 semitons). Baixe o Mi para Mib e o acorde fica menor. Toque as notas de cada acorde ao mesmo tempo: Dó maior (Dó, Mi e Sol); Dó menor (Dó, Mib e Sol)."
passos = "{C4 E4 G4}:Dó_maior {C4 Eb4 G4}:Dó_menor"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó maior. Ache Dó, Mi e Sol antes de apertar.",
  "Na posição fundamental, use os dedos 1, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Passe ao próximo acorde sem pressa, achando as teclas antes de apertar.",
  "Confira o desenho: maior: terça maior e quinta justa; menor: terça menor e quinta justa.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Maior e menor lado a lado."

[[exercicio]]
id = "la-mi-re-menor"
titulo = "Lá, Mi e Ré menor"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar três tríades menores muito usadas."
instrucoes = "Lá menor e Mi menor usam só teclas brancas. Ré menor também. Toque as notas de cada acorde ao mesmo tempo: Lá menor (Lá, Dó e Mi); Mi menor (Mi, Sol e Si); Ré menor (Ré, Fá e Lá)."
passos = "{A3 C4 E4}:Lá_menor {E4 G4 B4}:Mi_menor {D4 F4 A4}:Ré_menor"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Lá menor. Ache Lá, Dó e Mi antes de apertar.",
  "Na posição fundamental, use os dedos 1, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Passe ao próximo acorde sem pressa, achando as teclas antes de apertar.",
  "Confira o desenho: menor: terça menor e quinta justa.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Acordes tocados com as notas certas."

