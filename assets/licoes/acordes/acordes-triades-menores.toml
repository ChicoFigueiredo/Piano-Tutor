[[exercicio]]
id = "ciclo-quintas-menores"
titulo = "Os 12 acordes menores pelo ciclo das quintas"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar as 12 tríades menores, cada uma a uma quinta da anterior."
instrucoes = "A ordem é Lá, Mi, Si, Fá#, Dó#, Sol#, Mib, Sib, Fá, Dó, Sol e Ré. Toque as notas de cada acorde ao mesmo tempo: Lá menor (Lá, Dó e Mi); Mi menor (Mi, Sol e Si); Si menor (Si, Ré e Fá#); Fá# menor (Fá#, Lá e Dó#); Dó# menor (Dó#, Mi e Sol#); Sol# menor (Sol#, Si e Ré#); Mib menor (Mib, Solb e Sib); Sib menor (Sib, Réb e Fá); Fá menor (Fá, Láb e Dó); Dó menor (Dó, Mib e Sol); Sol menor (Sol, Sib e Ré); Ré menor (Ré, Fá e Lá)."
passos = "{A3 C4 E4}:Lá_menor {E4 G4 B4}:Mi_menor {B3 D4 F#4}:Si_menor {F#4 A4 C#5}:Fá#_menor {C#4 E4 G#4}:Dó#_menor {G#3 B3 D#4}:Sol#_menor {Eb4 Gb4 Bb4}:Mib_menor {Bb3 Db4 F4}:Sib_menor {F4 Ab4 C5}:Fá_menor {C4 Eb4 G4}:Dó_menor {G3 Bb3 D4}:Sol_menor {D4 F4 A4}:Ré_menor"
