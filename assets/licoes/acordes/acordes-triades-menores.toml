objetivo = "Tocar três tríades menores com a terça em tecla preta."
instrucoes = "A terça menor destes acordes cai numa tecla preta: Sib, Mib e Láb. Toque as notas de cada acorde ao mesmo tempo: Sol menor (Sol, Sib e Ré); Dó menor (Dó, Mib e Sol); Fá menor (Fá, Láb e Dó)."
