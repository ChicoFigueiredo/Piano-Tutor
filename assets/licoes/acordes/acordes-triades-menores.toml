instrucoes = "Nestes acordes a quinta ou a fundamental cai numa tecla preta. Preste atenção em cada uma. Toque as notas de cada acorde ao mesmo tempo: Si menor (Si, Ré e Fá#); Dó# menor (Dó#, Mi e Sol#); Fá# menor (Fá#, Lá e Dó#)."
