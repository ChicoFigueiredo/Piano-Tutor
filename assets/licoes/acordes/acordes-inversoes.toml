[[exercicio]]
id = "do-posicao-fundamental"
titulo = "Dó maior na posição fundamental"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar Dó maior com a fundamental embaixo."
instrucoes = "Na posição fundamental, a fundamental é a nota mais grave. Toque as notas de cada acorde ao mesmo tempo: Dó maior (Dó, Mi e Sol)."
passos = "{C4 E4 G4}:Dó_maior"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó maior. Ache Dó, Mi e Sol antes de apertar.",
  "Na posição fundamental, use os dedos 1, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Confira o desenho: maior: terça maior e quinta justa.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Acordes tocados com as notas certas."

