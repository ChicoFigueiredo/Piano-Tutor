instrucoes = "O vi é o acorde menor da tonalidade: Lá menor. Toque, na ordem: I = Dó maior (Dó, Mi e Sol); V = Sol maior (Si, Ré e Sol); vi = Lá menor (Dó, Mi e Lá); IV = Fá maior (Dó, Fá e Lá). As notas estão escolhidas para a mão quase não sair do lugar."
passos = "{C4 E4 G4}:I_Dó {B3 D4 G4}:V_Dó {C4 E4 A4}:vi_Dó {C4 F4 A4}:IV_Dó"
