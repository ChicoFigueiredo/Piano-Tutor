[licao]
id = "acordes-cadencias"
trilha = "Acordes"
ordem_trilha = 30
ordem = 6
titulo = "Cadências e progressões em Dó, Sol e Fá"
descricao = "Cadência I-IV-V-I e progressão I-V-vi-IV nas tonalidades de Dó, Sol e Fá maior."
nivel = "basico"
situacao = "proposta"
fontes = ["Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde", "Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Introduction to Chords, musictheory.net: https://musictheory.net/lessons/40", "Circle of fifths (Wikipedia): https://en.wikipedia.org/wiki/Circle_of_fifths"]
requer = []

[[exercicio]]
id = "i-iv-v-i-do"
titulo = "Cadência I-IV-V-I em Dó maior"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar a cadência I-IV-V-I em Dó maior."
instrucoes = "A cadência I-IV-V-I volta ao acorde de repouso. Toque, na ordem: I = Dó maior (Dó, Mi e Sol); IV = Fá maior (Dó, Fá e Lá); V = Sol maior (Si, Ré e Sol); I = Dó maior (Dó, Mi e Sol). As notas estão escolhidas para a mão quase não sair do lugar."
passos = "{C4 E4 G4}:I_Dó {C4 F4 A4}:IV_Dó {B3 D4 G4}:V_Dó {C4 E4 G4}:I_Dó"
roteiro = [
  "Ponha a mão direita perto do Dó central, com os dedos curvos.",
  "O primeiro acorde é o I: Dó maior.",
  "Os acordes estão escolhidos para a mão mexer pouco: ache cada grupo de teclas antes de apertar.",
  "Aperte as notas juntas e solte na hora de trocar de acorde.",
  "Ouça como o V pede para voltar ao I.",
]
erro = "Confira cada acorde: eles seguem a escala da tonalidade."
conclusao = "Cadência completa."

