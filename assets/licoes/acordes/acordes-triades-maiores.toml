[licao]
id = "acordes-triades-maiores"
trilha = "Acordes"
ordem_trilha = 30
ordem = 1
titulo = "Tríades maiores nos 12 tons"
descricao = "Montar e tocar as tríades maiores em todos os 12 tons, com o ciclo das quintas."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde", "Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Introduction to Chords, musictheory.net: https://musictheory.net/lessons/40", "Circle of fifths (Wikipedia): https://en.wikipedia.org/wiki/Circle_of_fifths"]
requer = []

[[exercicio]]
id = "montar-do-maior"
titulo = "Montar o acorde de Dó maior"
tipo = "sequencia"
mao = "direita"
objetivo = "Construir a tríade de Dó maior nota a nota: fundamental, terça e quinta."
instrucoes = "Toque Dó, Mi e Sol, uma nota de cada vez, de baixo para cima. De Dó a Mi são quatro semitons (terça maior). De Mi a Sol são três semitons. Juntas, as três notas formam a tríade maior."
passos = "C4 E4 G4"
roteiro = [
  "Ponha a mão direita com o polegar no Dó central.",
  "Toque o Dó com o dedo 1.",
  "Pule uma tecla branca e toque o Mi com o dedo 3.",
  "Pule outra tecla branca e toque o Sol com o dedo 5.",
  "Ouça as três notas: juntas, elas formam o acorde de Dó maior.",
]
erro = "Dó, depois Mi, depois Sol: pule uma tecla branca entre elas."
conclusao = "Você montou Dó maior."

[[exercicio]]
id = "do-fa-sol-maior"
titulo = "Dó, Fá e Sol maior"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar três tríades maiores sobre teclas brancas."
instrucoes = "Toda tríade maior tem a terça maior (4 semitons) e a quinta justa (7 semitons) sobre a fundamental. Toque as notas de cada acorde ao mesmo tempo: Dó maior (Dó, Mi e Sol); Fá maior (Fá, Lá e Dó); Sol maior (Sol, Si e Ré)."
passos = "{C4 E4 G4}:Dó_maior {F4 A4 C5}:Fá_maior {G3 B3 D4}:Sol_maior"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó maior. Ache Dó, Mi e Sol antes de apertar.",
  "Na posição fundamental, use os dedos 1, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Passe ao próximo acorde sem pressa, achando as teclas antes de apertar.",
  "Confira o desenho: maior: terça maior e quinta justa.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Acordes tocados com as notas certas."

