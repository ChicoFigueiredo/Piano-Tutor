[[exercicio]]
id = "ciclo-quintas-maiores"
titulo = "Os 12 acordes maiores pelo ciclo das quintas"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar as 12 tríades maiores, cada uma a uma quinta da anterior."
instrucoes = "Cada acorde começa uma quinta acima do anterior: Dó, Sol, Ré, Lá, Mi, Si, Fá#, Réb, Láb, Mib, Sib e Fá. Toque as notas de cada acorde ao mesmo tempo: Dó maior (Dó, Mi e Sol); Sol maior (Sol, Si e Ré); Ré maior (Ré, Fá# e Lá); Lá maior (Lá, Dó# e Mi); Mi maior (Mi, Sol# e Si); Si maior (Si, Ré# e Fá#); Fá# maior (Fá#, Lá# e Dó#); Réb maior (Réb, Fá e Láb); Láb maior (Láb, Dó e Mib); Mib maior (Mib, Sol e Sib); Sib maior (Sib, Ré e Fá); Fá maior (Fá, Lá e Dó)."
passos = "{C4 E4 G4}:Dó_maior {G3 B3 D4}:Sol_maior {D4 F#4 A4}:Ré_maior {A3 C#4 E4}:Lá_maior {E4 G#4 B4}:Mi_maior {B3 D#4 F#4}:Si_maior {F#4 A#4 C#5}:Fá#_maior {Db4 F4 Ab4}:Réb_maior {Ab3 C4 Eb4}:Láb_maior {Eb4 G4 Bb4}:Mib_maior {Bb3 D4 F4}:Sib_maior {F4 A4 C5}:Fá_maior"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó maior. Ache Dó, Mi e Sol antes de apertar.",
  "Na posição fundamental, use os dedos 1, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Passe ao próximo acorde sem pressa, achando as teclas antes de apertar.",
  "Confira o desenho: maior: terça maior e quinta justa.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Os 12 acordes maiores completos."
