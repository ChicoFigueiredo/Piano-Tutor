[[exercicio]]
id = "do-tres-setimas"
titulo = "As três sétimas de Dó"
tipo = "acorde"
mao = "direita"
objetivo = "Comparar Dó maj7, Dó 7 e Dó m7."
instrucoes = "A fundamental é a mesma. Mude só a terça e a sétima. Toque as notas de cada acorde ao mesmo tempo: Dó maj7 (Dó, Mi, Sol e Si); Dó 7 (Dó, Mi, Sol e Sib); Dó m7 (Dó, Mib, Sol e Sib)."
passos = "{C4 E4 G4 B4}:Dó_maj7 {C4 E4 G4 Bb4}:Dó_7 {C4 Eb4 G4 Bb4}:Dó_m7"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó maj7. Ache Dó, Mi, Sol e Si antes de apertar.",
  "Com quatro notas, use os dedos 1, 2, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Passe ao próximo acorde sem pressa, achando as teclas antes de apertar.",
  "Confira o desenho: maj7: tríade maior mais sétima maior; 7: tríade maior mais sétima menor.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Acordes tocados com as notas certas."

