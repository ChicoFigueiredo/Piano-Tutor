[[exercicio]]
id = "do-maj7"
titulo = "Dó maior com sétima maior (Cmaj7)"
tipo = "acorde"
mao = "direita"
objetivo = "Tocar o acorde Dó maj7."
instrucoes = "Some uma sétima maior (Si) à tríade de Dó maior. Soa suave e aberto. Toque as notas de cada acorde ao mesmo tempo: Dó maj7 (Dó, Mi, Sol e Si)."
passos = "{C4 E4 G4 B4}:Dó_maj7"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó maj7. Ache Dó, Mi, Sol e Si antes de apertar.",
  "Com quatro notas, use os dedos 1, 2, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Confira o desenho: maj7: tríade maior mais sétima maior.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Acordes tocados com as notas certas."

