[licao]
id = "acordes-com-andamento"
trilha = "Acordes"
ordem_trilha = 30
ordem = 8
titulo = "Acordes no tempo: troque no 1 do compasso"
descricao = "Cadências e progressões em Dó, Sol e Fá com metrônomo, contagem e troca de acorde no tempo, do andamento lento ao mais vivo."
nivel = "basico"
situacao = "proposta"
fontes = ["Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde", "Metrônomo, Wikipédia: https://pt.wikipedia.org/wiki/Metrônomo", "Introduction to Chords, musictheory.net: https://musictheory.net/lessons/40", "Circle of fifths (Wikipedia): https://en.wikipedia.org/wiki/Circle_of_fifths"]
requer = ["acordes-cadencias"]

[[exercicio]]
id = "i-iv-v-i-do-ouvir-60"
titulo = "I-IV-V-I em Dó, ouvindo e acompanhando (60 BPM)"
tipo = "acorde"
mao = "direita"
objetivo = "Acompanhar o app trocando de acorde no 1 de cada compasso."
instrucoes = "O app toca o metrônomo e os acordes por você. Depois da contagem, toque junto com ele, na ordem: I = Dó maior (Dó, Mi e Sol); IV = Fá maior (Dó, Fá e Lá); V = Sol maior (Si, Ré e Sol); I = Dó maior (Dó, Mi e Sol). Cada acorde dura um compasso de quatro tempos, e são duas voltas."
passos = "{C4 E4 G4}:I_Dó {C4 F4 A4}:IV_Dó {B3 D4 G4}:V_Dó {C4 E4 G4}:I_Dó"
andamento = 60
compasso = "4/4"
compassos_por_passo = 1
contagem = 1
app_toca = true
ordem = "sequencial"
voltas = 2
roteiro = [
  "Ponha a mão direita perto do Dó central, com os dedos curvos.",
  "Inicie e espere a contagem: são quatro batidas de preparação, sem tocar.",
  "Ouça o primeiro acorde e aperte as mesmas notas junto com ele.",
  "Troque no 1 do compasso: solte e aperte o acorde seguinte na hora em que o app troca.",
  "Mantenha a mão perto das teclas e conte baixinho 1, 2, 3, 4.",
]
acerto = "No tempo."
erro = "Confira o acorde e tente de novo na próxima volta."
conclusao = "Você acompanhou as duas voltas."
requer = ""

