[[exercicio]]
id = "do-menor-para-diminuta"
titulo = "De Dó menor para Dó diminuta"
tipo = "acorde"
mao = "direita"
objetivo = "Perceber que baixar a quinta meio tom faz a tríade diminuta."
instrucoes = "A tríade diminuta tem duas terças menores empilhadas. Baixe o Sol de Dó menor para Solb. Toque as notas de cada acorde ao mesmo tempo: Dó menor (Dó, Mib e Sol); Dó diminuta (Dó, Mib e Solb)."
passos = "{C4 Eb4 G4}:Dó_menor {C4 Eb4 Gb4}:Dó_diminuta"
roteiro = [
  "Ponha a mão direita sobre as teclas, com os dedos curvos e o punho solto.",
  "Primeiro acorde: Dó menor. Ache Dó, Mib e Sol antes de apertar.",
  "Na posição fundamental, use os dedos 1, 3 e 5.",
  "Aperte todas as notas ao mesmo tempo, com o mesmo peso, e solte.",
  "Passe ao próximo acorde sem pressa, achando as teclas antes de apertar.",
  "Confira o desenho: menor: terça menor e quinta justa; diminuta: terça menor e quinta diminuta.",
]
erro = "Confira as teclas pretas de cada acorde."
conclusao = "Acordes tocados com as notas certas."

