instrucoes = "Cada tríade diminuta soa tensa, pedindo resolução. Toque as notas de cada acorde ao mesmo tempo: Dó diminuta (Dó, Mib e Solb); Ré diminuta (Ré, Fá e Láb); Mi diminuta (Mi, Sol e Sib)."
