[licao]
id = "ouvido-segundas-tercas"
trilha = "Ouvido e intervalos"
ordem_trilha = 50
ordem = 1
titulo = "Intervalos harmônicos: segundas e terças"
descricao = "Tocar duas teclas juntas e ouvir a segunda e a terça, maiores e menores."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde"]
requer = []

[[exercicio]]
id = "segunda-maior"
titulo = "Segunda maior"
tipo = "intervalos"
mao = "direita"
objetivo = "Tocar e ouvir a segunda maior (dois semitons)."
instrucoes = "A segunda maior tem uma tecla no meio. Toque as duas teclas juntas: Dó e Ré (segunda maior); Fá e Sol (segunda maior); Sol e Lá (segunda maior)."
passos = "[C4 D4]:segunda_maior [F4 G4]:segunda_maior [G4 A4]:segunda_maior"
roteiro = [
  "Ponha dois dedos sobre as teclas do primeiro intervalo: Dó e Ré.",
  "Escolha os dedos pelo tamanho: vizinhos para intervalos pequenos; abra a mão, com o 1 e o 5, nos grandes.",
  "Aperte as duas teclas ao mesmo tempo e ouça o som inteiro.",
  "Confira o tamanho: de Dó a Ré são 2 semitons, contando cada tecla, branca ou preta.",
  "Solte e passe ao próximo intervalo com a mesma calma.",
]
erro = "Confira o espaço entre as duas teclas."
conclusao = "Intervalos tocados e ouvidos."

