instrucoes = "A segunda menor são duas teclas coladas e soa tensa. Toque as duas teclas juntas: Mi e Fá (segunda menor); Si e Dó (segunda menor); Si e Dó (segunda menor)."
passos = "[E4 F4]:segunda_menor [B3 C4]:segunda_menor [B4 C5]:segunda_menor"
