[licao]
id = "ouvido-quartas-quintas-oitavas"
trilha = "Ouvido e intervalos"
ordem_trilha = 50
ordem = 2
titulo = "Intervalos harmônicos: quartas, quintas e oitavas"
descricao = "Os intervalos justos e o trítono, tocados com as duas teclas juntas."
nivel = "iniciante"
situacao = "proposta"
fontes = ["Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde"]
requer = []

[[exercicio]]
id = "quarta-justa"
titulo = "Quarta justa"
tipo = "intervalos"
mao = "direita"
objetivo = "Tocar e ouvir a quarta justa (cinco semitons)."
instrucoes = "A quarta justa soa firme e aberta. Toque as duas teclas juntas: Dó e Fá (quarta justa); Sol e Dó (quarta justa); Ré e Sol (quarta justa); Lá e Ré (quarta justa)."
passos = "[C4 F4]:quarta_justa [G4 C5]:quarta_justa [D4 G4]:quarta_justa [A3 D4]:quarta_justa"
roteiro = [
  "Ponha dois dedos sobre as teclas do primeiro intervalo: Dó e Fá.",
  "Escolha os dedos pelo tamanho: vizinhos para intervalos pequenos; abra a mão, com o 1 e o 5, nos grandes.",
  "Aperte as duas teclas ao mesmo tempo e ouça o som inteiro.",
  "Confira o tamanho: de Dó a Fá são 5 semitons, contando cada tecla, branca ou preta.",
  "Solte e passe ao próximo intervalo com a mesma calma.",
]
erro = "Confira o espaço entre as duas teclas."
conclusao = "Intervalos tocados e ouvidos."

