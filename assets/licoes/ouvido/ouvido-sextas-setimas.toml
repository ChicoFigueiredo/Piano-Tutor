[[exercicio]]
id = "sexta-maior"
titulo = "Sexta maior"
tipo = "intervalos"
mao = "direita"
objetivo = "Tocar e ouvir a sexta maior (nove semitons)."
instrucoes = "A sexta maior soa aberta e doce. Toque as duas teclas juntas: Dó e Lá (sexta maior); Sol e Mi (sexta maior); Ré e Si (sexta maior); Fá e Ré (sexta maior)."
passos = "[C4 A4]:sexta_maior [G4 E5]:sexta_maior [D4 B4]:sexta_maior [F4 D5]:sexta_maior"
roteiro = [
  "Ponha dois dedos sobre as teclas do primeiro intervalo: Dó e Lá.",
  "Escolha os dedos pelo tamanho: vizinhos para intervalos pequenos; abra a mão, com o 1 e o 5, nos grandes.",
  "Aperte as duas teclas ao mesmo tempo e ouça o som inteiro.",
  "Confira o tamanho: de Dó a Lá são 9 semitons, contando cada tecla, branca ou preta.",
  "Solte e passe ao próximo intervalo com a mesma calma.",
]
erro = "Confira o espaço entre as duas teclas."
conclusao = "Intervalos tocados e ouvidos."

