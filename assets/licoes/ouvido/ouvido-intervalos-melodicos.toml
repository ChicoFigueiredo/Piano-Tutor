[licao]
id = "ouvido-intervalos-melodicos"
trilha = "Ouvido e intervalos"
ordem_trilha = 50
ordem = 4
titulo = "Intervalos melódicos"
descricao = "O app toca duas notas, uma depois da outra, e você repete: subindo e descendo."
nivel = "basico"
situacao = "proposta"
fontes = ["Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde"]
requer = []

[[exercicio]]
id = "segunda-maior-sub"
titulo = "Segunda maior melódica, subindo"
tipo = "ouvir"
mao = "direita"
objetivo = "Ouvir e repetir uma segunda maior subindo."
instrucoes = "O app toca duas notas, uma depois da outra. Ouça e repita no teclado. As duas notas estão coladas, com uma tecla no meio. A primeira nota é o Ré."
passos = "D4 E4"
roteiro = [
  "Ouça a frase inteira sem tocar, com atenção ao desenho: sobe, desce ou salta.",
  "Cantarole ou assobie a frase baixinho para fixá-la.",
  "Ache no teclado a primeira nota, que é o Ré.",
  "Toque as notas seguintes, comparando cada uma com o que você ouviu.",
  "Se errar, peça para ouvir de novo ou use a dica para ver as teclas.",
]
erro = "Ouça de novo e tente outra vez. Peça a dica se precisar ver as teclas."
conclusao = "Você repetiu a frase de ouvido."

