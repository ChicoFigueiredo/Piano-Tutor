[licao]
id = "ouvido-frases-longas"
trilha = "Ouvido e intervalos"
ordem_trilha = 50
ordem = 7
titulo = "Ouvir e repetir: frases de quatro a seis notas"
descricao = "Frases de quatro a seis notas, de ida e volta, e começos de melodias tradicionais."
nivel = "basico"
situacao = "proposta"
fontes = ["Intervalo (música), Wikipédia: https://pt.wikipedia.org/wiki/Intervalo_(música)", "Acorde, Wikipédia: https://pt.wikipedia.org/wiki/Acorde", "Frère Jacques, Au clair de la lune, Ah! vous dirai-je, maman e Ode à Alegria: melodias de domínio público"]
requer = []

[[exercicio]]
id = "quatro-sobe-graus"
titulo = "Quatro notas subindo por graus"
tipo = "ouvir"
mao = "direita"
objetivo = "Ouvir e repetir quatro notas que sobem por graus."
instrucoes = "O app toca uma frase de 4 notas. Ouça e repita no teclado, na mesma ordem. As notas são vizinhas. A primeira nota é o Dó."
passos = "C4 D4 E4 F4"
roteiro = [
  "Ouça a frase inteira sem tocar, com atenção ao desenho: sobe, desce ou salta.",
  "Cantarole ou assobie a frase baixinho para fixá-la.",
  "Ache no teclado a primeira nota, que é o Dó.",
  "Toque as notas seguintes, comparando cada uma com o que você ouviu.",
  "Se errar, peça para ouvir de novo ou use a dica para ver as teclas.",
]
erro = "Ouça de novo e tente outra vez. Peça a dica se precisar ver as teclas."
conclusao = "Você repetiu a frase de ouvido."

