name: CI (núcleo Rust e documentação)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar documentação
        run: python3 scripts/verificar-documentacao.py
      # ALSA (diag) e bibliotecas de janela/OpenGL da bancada-casca (X11 e Wayland).
      # A bancada é pública (MIT OR Apache-2.0): o Cargo a baixa por git, sem credencial.
      - name: Dependências de sistema (ALSA, X11, Wayland, OpenGL)
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev pkg-config
          libx11-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev
          libxcursor-dev libxrandr-dev libxi-dev
      - name: Rust fmt
        run: cargo fmt --all --check
      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust test
        run: cargo test --workspace
# Não comprova ligação física REVAS, MIDI real, áudio, Linux de referência ou modelos de IA.

  # Auditoria de dependências (ticket evolucao/01; R-N03, T6, T10). Config: deny.toml.
  # Medido localmente: ~7 s a frio, ~2 s com cache. Não usa credencial; a bancada é pública.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny (licenças, bans, fontes)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  # Advisories dependem do banco RustSec (rede) e de avisos novos que surgem sem mudança de
  # código: job separado e não bloqueante. Falha visível, mas não derruba o PR.
  deny-advisories:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: cargo deny (advisories, não bloqueante)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
