version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[dependencies]
piano-tutor-core = { path = "../piano-tutor-core" }
# Versões fixadas (=) e licenças conferidas: ver docs/seguranca/LICENCAS-E-DADOS.md
