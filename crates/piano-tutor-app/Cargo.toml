[package]
name = "piano-tutor-app"
description = "Piano Tutor: teclado MIDI, espelho de 61 teclas e som SoundFont sobre a bancada-casca (M1)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
build = "build.rs"

[lib]
name = "piano_tutor_app"
path = "src/lib.rs"

[[bin]]
name = "piano-tutor-app"
path = "src/main.rs"

[dependencies]
# Núcleo musical puro (teclado de 61 teclas, nomes de nota, modo simulação).
piano-tutor-core = { path = "../piano-tutor-core" }
# Entrada MIDI (F01) e motor de áudio (F03) do próprio workspace.
piano-tutor-midi = { path = "../piano-tutor-midi" }
piano-tutor-audio = { path = "../piano-tutor-audio" }
# Pacote de Curso (ADR-0009): leitor, instalador, Roteiro e Alinhamento (só dados, assinado).
piano-tutor-curso = { path = "../piano-tutor-curso" }
# Shell compartilhada (ADR-0002/0004), repositório público MIT OR Apache-2.0, fixada por SHA.
# Download do SoundFont na primeira execução (sem sudo, nas três plataformas).
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }  # MIT OR Apache-2.0
sha2 = "=0.11.1"   # MIT OR Apache-2.0
dirs = "=7.0.0"    # MIT OR Apache-2.0
# IPC JSON do mpv (posição do áudio do professor): MIT OR Apache-2.0.
serde_json = "=1.0.154"
# Roteiro do professor (roteiro.toml, M4 etapa 6): leitura de TOML tipada.
toml = { version = "=1.2.0", default-features = false, features = ["parse", "serde", "std"] }  # MIT OR Apache-2.0
serde = { version = "=1.0.229", features = ["derive"] }  # MIT OR Apache-2.0
# Revisão do conteúdo do tutor (M4, etapa 5): edita estado.toml e roteiro.toml sem perder campos,
# ordem nem comentários; lê as páginas PNG do PDF. Rust puro.
toml_edit = { version = "=0.25.20", default-features = false, features = ["parse", "display"] }  # MIT OR Apache-2.0
png = { version = "=0.18.1", default-features = false }  # MIT OR Apache-2.0
# Preferências e perfis em SQLite (ADR-0010); SQLite embutido, sem lib do sistema no .deb.
rusqlite = { version = "=0.43.0", features = ["bundled"] }  # MIT; SQLite é domínio público
# Vídeo embutido (ADR-0011): dlopen da libmpv.so.2 em tempo de execução, sem ligar nem exigir headers.
libloading = "=0.8.9"  # ISC
# Roteiro de Aula (ADR-0012): scripts Luau em sandbox. O Luau (luau0-src) é compilado e embutido
# pelo build do mlua-sys, sem lib do sistema (precisa só de um compilador C++).
mlua = { version = "=0.12.3", features = ["luau"] }  # MIT; Luau é MIT
bancada-casca = { git = "https://github.com/ChicoFigueiredo/bancada", rev = "94818fd95dc74b5a42a7757b1d258ed17822ed06" }

[dev-dependencies]
# Pastas temporárias nos testes de revisão: MIT OR Apache-2.0.
tempfile = "=3.27.0"

# Mesmos lints do workspace, exceto `unsafe_code`: `forbid` (workspace) vira `deny` aqui para que
# SÓ o módulo `video_embutido` (dlopen da libmpv, ADR-0011) o libere com `#![allow(unsafe_code)]`.
# Todo o resto do app continua sem `unsafe`. (`[lints] workspace = true` não admite exceções.)
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"

# Empacotamento .deb mínimo (F03, ticket #40). Gerado por scripts/empacotar-deb.sh.
# O SoundFont FluidR3_GM (MIT, Debian main) NÃO é embutido: vem como dependência do sistema.
# Decisão registrada em docs/aceite/F03/auditoria-sf2.md.
[package.metadata.deb]
name = "piano-tutor"
maintainer = "Piano Tutor <sem-email>"
copyright = "2026, Piano Tutor"
extended-description = "Piano Tutor: ouve o teclado MIDI, mostra o espelho de 61 teclas e toca com motor SoundFont (FluidR3_GM), sem Python."
section = "sound"
priority = "optional"
depends = "$auto, fluid-soundfont-gm"
assets = [
    ["target/release/piano-tutor-app", "usr/bin/piano-tutor", "755"],
    ["pacote/piano-tutor.desktop", "usr/share/applications/piano-tutor.desktop", "644"],
    ["../../assets/icones/piano-tutor.svg", "usr/share/icons/hicolor/scalable/apps/piano-tutor.svg", "644"],
    ["../../README.md", "usr/share/doc/piano-tutor/README.md", "644"],
]
