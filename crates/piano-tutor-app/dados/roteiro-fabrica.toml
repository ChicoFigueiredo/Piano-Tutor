# Roteiro do Curso de fábrica (formato: docs/specs/FORMATO-PACOTE-DE-CURSO.md, roteiro.toml).
#
# Falas do professor para os 10 exercícios de fábrica (crates/piano-tutor-app/src/exercicios.rs).
# Todas nascem como "hipotese" e só viram voz depois que o Chico trocar para "aprovada"
# (a voz só diz falas aprovadas). Sem "#" nem "b" no texto: a voz lê por extenso.
#
# licao = "fabrica"; exercicio = "exNN", com NN o id do exercício (01 a 10).
#
# "acerto" e "erro" são comentários de TRECHO, ditos ao concluir o exercício (nunca a cada nota):
# "acerto" quando a tentativa saiu sem nota errada, "erro" quando teve alguma. Vêm antes do "depois".

formato_versao = 1

[[falas]]
id = "fabrica-ex01-antes"
licao = "fabrica"
exercicio = "ex01"
momento = "antes"
texto = "Vamos começar achando o Dó central: a tecla branca à esquerda das duas pretas, no meio do teclado."
estado = "hipotese"

[[falas]]
id = "fabrica-ex01-acerto"
licao = "fabrica"
exercicio = "ex01"
momento = "acerto"
texto = "Boa! Achou o Dó de primeira."
estado = "hipotese"

[[falas]]
id = "fabrica-ex01-erro"
licao = "fabrica"
exercicio = "ex01"
momento = "erro"
texto = "Quase. Procure o grupo de duas teclas pretas e toque a branca à esquerda dele; vamos de novo, com calma."
estado = "hipotese"

[[falas]]
id = "fabrica-ex01-depois"
licao = "fabrica"
exercicio = "ex01"
momento = "depois"
texto = "Muito bem. As outras notas a gente conta a partir do Dó central."
estado = "hipotese"

[[falas]]
id = "fabrica-ex02-antes"
licao = "fabrica"
exercicio = "ex02"
momento = "antes"
texto = "Agora toque Dó, Ré, Mi, Fá e Sol, subindo, e depois desça de volta, uma nota de cada vez."
estado = "hipotese"

[[falas]]
id = "fabrica-ex02-acerto"
licao = "fabrica"
exercicio = "ex02"
momento = "acerto"
texto = "Boa! A subida e a descida saíram limpas. Agora de novo, um pouco mais depressa, se quiser."
estado = "hipotese"

[[falas]]
id = "fabrica-ex02-erro"
licao = "fabrica"
exercicio = "ex02"
momento = "erro"
texto = "Teve umas notas fora do lugar. Vamos de novo, mais devagar, olhando a tecla marcada."
estado = "hipotese"

[[falas]]
id = "fabrica-ex02-depois"
licao = "fabrica"
exercicio = "ex02"
momento = "depois"
texto = "Dez notas na ordem certa. Você já domina as cinco notas, de Dó a Sol."
estado = "hipotese"

[[falas]]
id = "fabrica-ex03-antes"
licao = "fabrica"
exercicio = "ex03"
momento = "antes"
texto = "Toque três notas na ordem: Mi, Dó e Sol."
estado = "hipotese"

[[falas]]
id = "fabrica-ex03-acerto"
licao = "fabrica"
exercicio = "ex03"
momento = "acerto"
texto = "Boa! A ordem saiu certa. Agora de novo, sem olhar a tecla marcada."
estado = "hipotese"

[[falas]]
id = "fabrica-ex03-erro"
licao = "fabrica"
exercicio = "ex03"
momento = "erro"
texto = "A ordem é Mi, Dó, Sol. Vamos de novo, uma nota de cada vez, mais devagar."
estado = "hipotese"

[[falas]]
id = "fabrica-ex03-depois"
licao = "fabrica"
exercicio = "ex03"
momento = "depois"
