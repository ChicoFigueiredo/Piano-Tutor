# Roteiro do Curso de fábrica (formato: docs/specs/FORMATO-PACOTE-DE-CURSO.md, roteiro.toml).
#
# Falas do professor para os 10 exercícios de fábrica (crates/piano-tutor-app/src/exercicios.rs).
# Todas nascem como "hipotese" e só viram voz depois que o Chico trocar para "aprovada"
# (a voz só diz falas aprovadas). Sem "#" nem "b" no texto: a voz lê por extenso.
#
# licao = "fabrica"; exercicio = "exNN", com NN o id do exercício (01 a 10).

formato_versao = 1

[[falas]]
id = "fabrica-ex01-antes"
licao = "fabrica"
exercicio = "ex01"
momento = "antes"
texto = "Vamos começar achando o Dó central: a tecla branca à esquerda das duas pretas, no meio do teclado."
estado = "hipotese"

[[falas]]
id = "fabrica-ex01-acerto"
licao = "fabrica"
exercicio = "ex01"
